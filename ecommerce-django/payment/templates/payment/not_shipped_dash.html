{% extends 'base.html' %}
{% block content %}

<br>
<br>
<div class="container">
    <div class="row">
        <div class="col-md-6 offset-md-3">
            <h3 class="text-secondary">Unshipped Items</h3>
            <table class="table table-striped table-hover table-border">
                <thead class="table-dark">
                <tr>
                    <th scope="col">Order</th>
                    <th scope="col">Price</th>
                    <th scope="col">Customer email</th>
                    <th scope="col">Date ordered</th>
                    <th scope="col">Shipped</th>
                </tr>
                </thead>
                <tbody>
                {% for order in orders %}
                <tr>
                    <th scope="row"><a href="{% url 'orders' order.id %}"> {{ order.id }}</a></th>
                    <td>{{ order.amount_paid }}$</td>
                    <td>{{ order.email }}</td>
                    <td>{{ order.date_ordered }}</td>
                    <td>
                        <form action="" method="POST">
                            {% csrf_token %}
                            <input type="hidden" name="shipping_status" value="true">
                            <input type="hidden" name="num" value="{{ order.id }}">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Mark Shipped</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
<br>
<br>

{% endblock %}
